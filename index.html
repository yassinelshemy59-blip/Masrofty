<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مصروفاتي">
<meta name="theme-color" content="#05060d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>مصروفاتي</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;box-sizing:border-box;--bg:#05060d;--ink:#fff;--mut:#9aa3bb;--cy:#a5f3fc;--bl:#1a2f9e;--card:rgba(255,255,255,.05);--bd:rgba(255,255,255,.11);--red:#ff6b7a;
padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,sans-serif;min-height:100vh;
background-image:radial-gradient(120% 55% at 85% 0%,#1d36b5 0%,#101d66 38%,transparent 72%);background-repeat:no-repeat;
padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:18px 18px 0}
.num,.lab,h1,h2{font-family:'Barlow Condensed','Cairo',sans-serif}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}
.brand{font-weight:700;font-size:20px;display:flex;align-items:center;gap:9px}
.brand i{width:26px;height:20px;background:repeating-linear-gradient(115deg,#2a45e6 0 6px,transparent 6px 9px);display:block;transform:skewX(-8deg)}
.eyebrow{display:flex;align-items:center;gap:12px;color:var(--cy);font-size:13px;font-weight:600;margin-bottom:8px}
.eyebrow::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(165,243,252,.5),transparent)}
.mut{color:var(--mut);font-size:13px}
.big{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:68px;line-height:1;letter-spacing:.5px;direction:ltr;text-align:right}
.big small{font-size:22px;font-weight:600;color:var(--cy);margin-inline-start:8px;font-family:'Cairo'}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-top:16px;backdrop-filter:blur(6px)}
.day{display:flex;justify-content:space-between;align-items:flex-end}
.day .num{font-size:38px;font-weight:700;direction:ltr}
.day em{font-style:italic;color:var(--cy);font-family:'Cairo'}
.lab{letter-spacing:2px;font-size:13px;color:var(--mut);font-weight:600}
.dates{display:flex;gap:8px;align-items:center;margin-top:16px}
.dates select{flex:1;min-width:0}
select,input{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--bd);color:var(--ink);border-radius:13px;padding:13px 12px;font:600 15px 'Cairo',sans-serif;outline:none;appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,#9aa3bb 50%),linear-gradient(135deg,#9aa3bb 50%,transparent 50%);background-position:calc(0% + 18px) 52%,calc(0% + 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-inline-start:30px}
select option{background:#0d1233;color:#fff}
input:focus,select:focus{border-color:var(--cy);box-shadow:0 0 0 3px rgba(165,243,252,.15)}
input::placeholder{color:#6d7690}
.btn{border:0;border-radius:13px;font:700 15px 'Cairo',sans-serif;cursor:pointer;color:#fff;background:linear-gradient(135deg,#2a45e6,#1a2f9e);padding:13px 16px;transition:transform .1s}
.btn:active{transform:scale(.97)}
.ghost{background:rgba(255,255,255,.07);border:1px solid var(--bd)}
.sq{width:46px;height:46px;padding:0;flex:none;font-size:20px;line-height:1}
.form{display:grid;gap:10px}
.amt{font-family:'Barlow Condensed',sans-serif;font-size:30px!important;font-weight:700!important;direction:ltr;text-align:center}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:600 13px 'Cairo';color:var(--cy);background:rgba(165,243,252,.08);border:1px solid rgba(165,243,252,.25);border-radius:99px;padding:5px 13px;cursor:pointer}
.row{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.row .d{flex:1;font-weight:600;word-break:break-word}
.row .a{font-family:'Barlow Condensed';font-weight:700;font-size:22px;direction:ltr}
.x{width:32px;height:32px;border-radius:50%;border:1px solid var(--bd);background:rgba(255,255,255,.05);color:var(--red);font-size:16px;cursor:pointer;flex:none}
.ck{width:22px;height:22px;accent-color:#4d68ff;flex:none}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:4px}
.empty{text-align:center;color:var(--mut);padding:26px 8px;font-size:14px}
h2{font-size:30px;margin:0 0 4px;font-weight:800;line-height:1.05}
h2 em{font-family:'Cairo';font-style:italic;color:var(--cy);font-weight:600}
.mhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.mhead b{font-size:19px}
.mhead .num{font-size:30px;font-weight:700;direction:ltr}
.cat{margin:11px 0}
.cat .l{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.cat .l span:last-child{font-family:'Barlow Condensed';font-weight:700;font-size:17px;direction:ltr}
.tr{height:7px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden}
.tr i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#2a45e6,#7fe9f7)}
.tip{border-inline-start:3px solid var(--cy);padding:4px 12px;margin:12px 0;font-size:14px;line-height:1.7}
.tip b{color:var(--cy)}
nav{position:fixed;inset:auto 0 0 0;background:rgba(5,6,13,.9);backdrop-filter:blur(14px);border-top:1px solid var(--bd);display:flex;justify-content:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav div{display:flex;max-width:560px;width:100%;gap:6px}
nav button{flex:1;background:none;border:0;color:var(--mut);font:700 13px 'Cairo';padding:8px 4px;border-radius:12px;cursor:pointer}
nav button.on{color:#fff;background:rgba(42,69,230,.35)}
nav button span{display:block;font-size:19px;margin-bottom:1px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:#16205f;border:1px solid var(--bd);padding:11px 16px;border-radius:14px;display:flex;gap:14px;align-items:center;font-size:14px;z-index:9;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.toast button{background:none;border:0;color:var(--cy);font:700 14px 'Cairo';cursor:pointer}
.kb{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(13,18,51,.97);border-top:1px solid var(--bd);padding:8px 12px;display:flex}
.kb button{flex:1;border:0;border-radius:13px;padding:13px;font:700 16px 'Cairo',sans-serif;color:#fff;background:linear-gradient(135deg,#2a45e6,#1a2f9e)}
.fld{position:relative}
.clr{position:absolute;top:50%;left:10px;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:14px;padding:0;cursor:pointer}
.kp{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(10,14,40,.98);border-top:1px solid var(--bd);padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px))}
.kg{display:flex;gap:8px;direction:ltr;max-width:560px;margin:0 auto}
.kd{flex:3;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ks{flex:1;display:grid;grid-template-rows:1fr 3fr;gap:8px}
.kp button{border:1px solid var(--bd);border-radius:14px;background:rgba(255,255,255,.08);color:#fff;font:700 26px 'Barlow Condensed',sans-serif;height:56px;cursor:pointer;touch-action:manipulation}
.kp button:active{background:rgba(255,255,255,.22)}
.kp .ks button{height:auto}
.kp .nx{background:linear-gradient(135deg,#2a45e6,#1a2f9e);font:700 18px 'Cairo',sans-serif}
.dayv{padding-bottom:calc(380px + env(safe-area-inset-bottom,0px))}
.dp{display:grid;grid-template-columns:46px 1fr 46px;gap:10px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px}
.dt{text-align:center;display:flex;flex-direction:column;gap:2px}
.dt b{font-family:'Barlow Condensed','Cairo',sans-serif;font-size:30px;font-weight:700;line-height:1.1}
.dt span{color:var(--cy);font-size:13px;font-weight:600}
.sels{grid-column:1/-1;display:grid;grid-template-columns:.8fr 1.3fr 1fr;gap:8px;padding-top:12px;border-top:1px solid var(--bd)}
.sl{display:block;min-width:0}
.sl i{display:block;font-style:normal;color:var(--mut);font-size:12px;font-weight:600;margin:0 4px 5px}
.sl select{padding:11px 10px;padding-inline-start:26px;font-size:14px}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav><div id="nav"></div></nav>
<div id="toast"></div>
<div id="kp" class="kp hide"></div>
<div id="kb" class="kb hide"><button id="kbb" type="button"></button></div>
<script>
const MN=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const ESS=['ايجار','إيجار','فاتورة','فواتير','كهرباء','مياه','غاز','انترنت','نت','دواء','علاج','دكتور','مدرسة','دراسة','قسط','اشتراك'];
const KEY='mx_expenses_v1';
let mem=[];
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return mem}};
const save=()=>{mem=data;try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};
let data=load();
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
let sel=today(),tab='day',selMode=false,picked=new Set(),yr=new Date().getFullYear(),undo=null,tt;
const fmt=n=>(Math.round(n*100)/100).toLocaleString('en-US');
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=a=>a.reduce((s,e)=>s+e.a,0);
const parts=s=>s.split('-').map(Number);
function cats(list){const m={};list.forEach(e=>{const k=e.t.trim()||'بدون وصف';(m[k]=m[k]||{n:k,s:0,c:0});m[k].s+=e.a;m[k].c++});return Object.values(m).sort((a,b)=>b.s-a.s)}
function shift(n){const [y,m,d]=parts(sel);const t=new Date(y,m-1,d+n);sel=iso(t);picked.clear();render()}
function setDate(y,m,d){const dim=new Date(y,m,0).getDate();sel=y+'-'+pad(m)+'-'+pad(Math.min(d,dim));picked.clear();render()}
function add(){
  const a=document.getElementById('amt'),t=document.getElementById('desc');
  const v=parseFloat(a.value.replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).replace(/[٫,]/g,'.'));
  if(!v||v<=0){a.focus();a.style.borderColor='var(--red)';return}
  data.push({id:Date.now()+Math.random(),d:sel,a:v,t:t.value.trim()});save();render();
  kpHide()}
function del(ids){const gone=data.filter(e=>ids.includes(e.id));data=data.filter(e=>!ids.includes(e.id));save();undo=gone;picked.clear();
  if(!data.some(e=>e.d===sel))selMode=false;render();toast('تم حذف '+gone.length+(gone.length>1?' عناصر':' عنصر'),'تراجع',()=>{data=data.concat(undo);save();undo=null;render()})}
function toast(msg,btn,fn){const el=document.getElementById('toast');clearTimeout(tt);el.innerHTML='<div class="toast"><span>'+msg+'</span><button id="tb">'+btn+'</button></div>';
  document.getElementById('tb').onclick=()=>{fn();el.innerHTML=''};tt=setTimeout(()=>el.innerHTML='',6000)}
function years(){const s=new Set(data.map(e=>+e.d.slice(0,4)));const cy=new Date().getFullYear();for(let y=2024;y<=cy;y++)s.add(y);s.add(parts(sel)[0]);return [...s].sort((a,b)=>b-a)}
function opts(arr,cur){return arr.map(([v,l])=>`<option value="${v}"${v==cur?' selected':''}>${l}</option>`).join('')}

function vDay(){
  const [y,m,d]=parts(sel),list=data.filter(e=>e.d===sel),total=sum(data),dayT=sum(list);
  const dim=new Date(y,m,0).getDate(),isT=sel===today();
  const past=cats(data).slice(0,8).map(c=>c.n);
  const dn=new Date(y,m-1,d).toLocaleDateString('ar-EG',{weekday:'long'});
  return `<div class="top"><div class="brand"><i></i>مصروفاتي</div><span dir="ltr" style="font-weight:700;font-size:15px;color:var(--cy)">Hussein Mohamed</span></div>
  <div class="eyebrow">إجمالي المصروفات</div>
  <div class="big">${fmt(total)}<small>ج.م</small></div>
  <div class="card day"><div><div class="lab">${isT?'مصروف اليوم':'مصروف '+d+' '+MN[m-1]}</div><div class="mut" style="margin-top:2px">${list.length} عملية · ${dn}</div></div><div class="num">${fmt(dayT)}</div></div>
  <div class="dates dp">
    <button class="btn ghost sq" onclick="shift(-1)" aria-label="اليوم السابق">›</button><div class="dt"><b>${d} ${MN[m-1]} ${y}</b><span>${dn}${isT?' · اليوم':''}</span></div><button class="btn ghost sq" onclick="shift(1)" aria-label="اليوم التالي">‹</button>
    <div class="sels"><label class="sl"><i>اليوم</i><select id="sd" aria-label="اليوم">${opts(Array.from({length:dim},(_,i)=>[i+1,i+1]),d)}</select></label>
    <label class="sl"><i>الشهر</i><select id="sm" aria-label="الشهر">${opts(MN.map((n,i)=>[i+1,n]),m)}</select></label>
    <label class="sl"><i>السنة</i><select id="sy" aria-label="السنة">${opts(years().map(v=>[v,v]),y)}</select></label></div>
    
  </div>
  ${isT?'':'<button class="btn ghost" style="width:100%;margin-top:10px" onclick="sel=today();render()">الرجوع لتاريخ اليوم</button>'}
  <div class="card form">
    <input id="amt" class="amt" inputmode="none" placeholder="0" autocomplete="off">
    <input id="desc" list="dl" enterkeyhint="done" placeholder="اتصرف في إيه؟ (مواصلات، أكل، ماركت…)" autocomplete="off">
    <datalist id="dl">${past.map(p=>`<option value="${esc(p)}">`).join('')}</datalist>
    ${past.length?`<div class="chips">${past.map(p=>`<button class="chip" data-c="${esc(p)}">${esc(p)}</button>`).join('')}</div>`:''}
    <button class="btn" onclick="add()">إضافة المصروف</button>
  </div>
  <div class="card">
    <div class="bar"><span class="lab">عمليات ${d} ${MN[m-1]}</span>
    ${list.length?`<button class="chip" onclick="selMode=!selMode;picked.clear();render()">${selMode?'إلغاء':'تحديد'}</button>`:''}</div>
    ${selMode&&list.length?`<div class="row"><input type="checkbox" class="ck" id="all" ${picked.size===list.length?'checked':''}><span class="d">تحديد الكل</span><button class="btn" style="padding:8px 14px;background:#b3283a" id="delsel" ${picked.size?'':'disabled style="opacity:.4"'}>حذف (${picked.size})</button></div>`:''}
    ${list.length?list.map(e=>`<div class="row">${selMode?`<input type="checkbox" class="ck" data-id="${e.id}" ${picked.has(e.id)?'checked':''}>`:''}<span class="d">${esc(e.t)||'<span class="mut">بدون وصف</span>'}</span><span class="a">${fmt(e.a)}</span>${selMode?'':`<button class="x" data-del="${e.id}" aria-label="حذف">✕</button>`}</div>`).join('')
    :'<div class="empty">مفيش مصروفات في اليوم ده. اكتب المبلغ والوصف فوق وأضفه.</div>'}
  </div>`}

function vMonths(){
  const ys=years();
  const cards=[];
  for(let m=12;m>=1;m--){
    const list=data.filter(e=>e.d.startsWith(yr+'-'+pad(m)));if(!list.length)continue;
    const cs=cats(list),mx=cs[0].s;
    cards.push(`<div class="card"><div class="mhead"><b>${MN[m-1]}</b><span class="num">${fmt(sum(list))}</span></div>
    ${cs.map(c=>`<div class="cat"><div class="l"><span>${esc(c.n)} <span class="mut">×${c.c}</span></span><span>${fmt(c.s)}</span></div><div class="tr"><i style="width:${Math.max(4,c.s/mx*100)}%"></i></div></div>`).join('')}</div>`)}
  const yt=sum(data.filter(e=>e.d.startsWith(yr+'-')));
  return `<div class="top"><div class="brand"><i></i>مصروفاتي</div></div>
  <div class="eyebrow">الشهور</div><h2>كل شهر <em>لوحده</em></h2>
  <div class="dates" style="margin-top:14px"><select id="my">${opts(ys.map(v=>[v,v]),yr)}</select><div class="num" style="font-size:30px;font-weight:700;white-space:nowrap">${fmt(yt)} <span class="mut" style="font-size:13px;font-family:Cairo">ج.م</span></div></div>
  ${cards.join('')||'<div class="card empty">مفيش بيانات في سنة '+yr+'.</div>'}`}

function vInsights(){
  const cs=cats(data),total=sum(data);
  if(!cs.length)return `<div class="top"><div class="brand"><i></i>مصروفاتي</div></div><div class="eyebrow">التحليل</div><div class="card empty">سجّل كام مصروف الأول وهتظهر هنا التحليلات والاقتراحات.</div>`;
  const days=new Set(data.map(e=>e.d)),byDay={};data.forEach(e=>byDay[e.d]=(byDay[e.d]||0)+e.a);
  const mxd=Object.entries(byDay).sort((a,b)=>b[1]-a[1])[0];
  const isEss=n=>ESS.some(k=>n.includes(k));
  const cut=cs.filter(c=>!isEss(c.n)&&c.s/total>=.08).slice(0,4);
  const top=cs[0];
  return `<div class="top"><div class="brand"><i></i>مصروفاتي</div></div>
  <div class="eyebrow">التحليل</div><h2>إنت بتصرف على <em>إيه</em> أكتر؟</h2>
  <div class="card"><div class="mhead"><span class="lab">أكتر حاجة بتصرف عليها</span></div>
    <div class="mhead"><b style="font-size:24px;color:var(--cy)">${esc(top.n)}</b><span class="num">${fmt(top.s)}</span></div>
    <div class="mut">${Math.round(top.s/total*100)}% من إجمالي مصروفاتك · ${top.c} مرة</div></div>
  <div class="card"><div class="lab" style="margin-bottom:8px">ترتيب المصروفات</div>
    ${cs.slice(0,10).map(c=>`<div class="cat"><div class="l"><span>${esc(c.n)} <span class="mut">${Math.round(c.s/total*100)}%</span></span><span>${fmt(c.s)}</span></div><div class="tr"><i style="width:${Math.max(4,c.s/cs[0].s*100)}%"></i></div></div>`).join('')}</div>
  <div class="card"><div class="lab" style="margin-bottom:6px">مصاريف ممكن تتخلى عنها أو تقللها</div>
    ${cut.length?cut.map(c=>`<div class="tip"><b>${esc(c.n)}</b> — صرفت ${fmt(c.s)} ج.م (${c.c} مرة). لو قللتها 30% توفّر حوالي <b>${fmt(c.s*.3)} ج.م</b>.</div>`).join(''):'<div class="empty">مفيش مصروفات واضح إنها غير ضرورية لحد دلوقتي.</div>'}
    <div class="mut" style="margin-top:8px;font-size:12px">الاقتراحات بتستثني الحاجات الأساسية زي الإيجار والفواتير والعلاج.</div></div>
  <div class="card day"><div><div class="lab">متوسط الصرف اليومي</div><div class="mut">على ${days.size} يوم مسجل</div></div><div class="num">${fmt(total/days.size)}</div></div>
  <div class="card day"><div><div class="lab">أعلى يوم صرف</div><div class="mut">${mxd[0]}</div></div><div class="num">${fmt(mxd[1])}</div></div>`}

function render(){
  const v=tab==='day'?vDay():tab==='months'?vMonths():vInsights();
  const fa=document.activeElement&&document.activeElement.id;
  const sy=window.scrollY;document.getElementById('app').innerHTML=v;document.body.classList.toggle('dayv',tab==='day');window.scrollTo(0,sy);
  document.getElementById('nav').innerHTML=[['day','◉','اليوم'],['months','▦','الشهور'],['ins','◭','التحليل']].map(([k,i,l])=>`<button class="${tab===k?'on':''}" data-t="${k}"><span>${i}</span>${l}</button>`).join('');
  bind()}
function bind(){
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;selMode=false;picked.clear();render();scrollTo(0,0)});
  const g=id=>document.getElementById(id);
  if(g('sd')){const f=()=>setDate(+g('sy').value,+g('sm').value,+g('sd').value);g('sd').onchange=g('sm').onchange=g('sy').onchange=f;
    g('desc').onkeydown=e=>{if(e.key==='Enter')add()};g('amt').onkeydown=e=>{if(e.key==='Enter')g('desc').focus()};
    ['amt','desc'].forEach(id=>{const i=g(id),w=document.createElement('div');w.className='fld';i.parentNode.insertBefore(w,i);w.appendChild(i);if(id==='desc')i.style.paddingInlineEnd='44px';
      const b=document.createElement('button');b.type='button';b.className='clr hide';b.textContent='\u2715';b.setAttribute('aria-label','مسح');w.appendChild(b);
      b.onpointerdown=e=>e.preventDefault();b.onclick=()=>{i.value='';upd();i.focus({preventScroll:true})};i.oninput=upd});
    g('amt').onfocus=()=>{const y=window.scrollY;kpShow();[0,100,300].forEach(t=>setTimeout(()=>window.scrollTo(0,y),t))};g('amt').onblur=()=>setTimeout(()=>{if(document.activeElement!==document.getElementById('amt'))kpHide()},150);
    document.querySelectorAll('.chip[data-c]').forEach(c=>c.onclick=()=>{g('desc').value=c.dataset.c;g('amt').focus()});
    document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>del([+b.dataset.del]));
    document.querySelectorAll('.ck[data-id]').forEach(c=>c.onchange=()=>{c.checked?picked.add(+c.dataset.id):picked.delete(+c.dataset.id);render()});
    if(g('all'))g('all').onchange=e=>{picked.clear();if(e.target.checked)data.filter(x=>x.d===sel).forEach(x=>picked.add(x.id));render()};
    if(g('delsel'))g('delsel').onclick=()=>picked.size&&del([...picked])}
  if(g('my'))g('my').onchange=e=>{yr=+e.target.value;render()}}
const kb=document.getElementById('kb'),kbb=document.getElementById('kbb');
function kbPos(){const v=window.visualViewport;if(v)kb.style.bottom=Math.max(0,window.innerHeight-v.height-v.offsetTop)+'px'}
if(window.visualViewport){visualViewport.addEventListener('resize',kbPos);visualViewport.addEventListener('scroll',kbPos)}
function kbShow(w){kb.dataset.w=w;kbb.textContent=w==='amt'?'التالي ‹':'إضافة المصروف ✓';kb.classList.remove('hide');kbPos()}
function kbHide(){kb.classList.add('hide')}
kbb.onpointerdown=e=>e.preventDefault();
kbb.onclick=()=>{kb.dataset.w==='amt'?document.getElementById('desc').focus():add()};
const kp=document.getElementById('kp');
kp.innerHTML='<div class="kg"><div class="kd">'+['1','2','3','4','5','6','7','8','9','.','0','00'].map(k=>`<button data-k="${k}">${k}</button>`).join('')+'</div><div class="ks"><button data-k="del">\u232b</button><button data-k="next" class="nx">التالي ‹</button></div></div>';
function kpShow(){kp.classList.remove('hide');document.body.classList.add('kpo')}
function kpHide(){kp.classList.add('hide');document.body.classList.remove('kpo')}
function upd(){['amt','desc'].forEach(id=>{const i=document.getElementById(id),b=i&&i.parentNode.querySelector('.clr');if(b)b.classList.toggle('hide',!i.value)})}
kp.onpointerdown=e=>e.preventDefault();
kp.onclick=e=>{const k=e.target.closest('button');if(!k)return;const a=document.getElementById('amt'),c=k.dataset.k;
  if(c==='next'){document.getElementById('desc').focus({preventScroll:true});return}
  if(c==='del')a.value=a.value.slice(0,-1);
  else{if(c==='.'&&a.value.includes('.'))return;if(!a.value&&c==='00')return;if(c==='.'&&!a.value)a.value='0';if(a.value.length<12)a.value+=c}
  upd();a.focus({preventScroll:true})};
document.addEventListener('click',e=>{if(e.target.closest('#kp,input,.clr,select,label'))return;const a=document.activeElement;if(a&&(a.id==='amt'||a.id==='desc'))a.blur();kpHide()});
render();
</script>
</body>
