<title>مصروفاتي</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;box-sizing:border-box;--bg:#05060d;--ink:#fff;--mut:#9aa3bb;--cy:#a5f3fc;--bl:#1a2f9e;--card:rgba(255,255,255,.05);--bd:rgba(255,255,255,.11);--red:#ff6b7a;
padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,sans-serif;min-height:100vh;
background-image:radial-gradient(120% 55% at 85% 0%,#1d36b5 0%,#101d66 38%,transparent 72%);background-repeat:no-repeat;
padding-bottom:calc(108px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:18px 18px 0}
.num,.lab,h1,h2{font-family:'Barlow Condensed','Cairo',sans-serif}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}
.brand{font-weight:700;font-size:20px;display:flex;align-items:center;gap:9px}
.brand i{width:26px;height:20px;background:repeating-linear-gradient(115deg,#2a45e6 0 6px,transparent 6px 9px);display:block;transform:skewX(-8deg)}
.eyebrow{display:flex;align-items:center;gap:12px;color:var(--cy);font-size:13px;font-weight:600;margin-bottom:8px}
.eyebrow::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(165,243,252,.5),transparent)}
.mut{color:var(--mut);font-size:13px}
.big{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:50px;line-height:1;letter-spacing:.5px;direction:ltr;text-align:right}
.big small{font-size:17px;font-weight:600;color:var(--cy);margin-inline-start:8px;font-family:'Cairo'}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-top:16px}
.day{display:flex;justify-content:space-between;align-items:flex-end}
.day .num{font-size:38px;font-weight:700;direction:ltr}
.day em{font-style:italic;color:var(--cy);font-family:'Cairo'}
.lab{letter-spacing:2px;font-size:13px;color:var(--mut);font-weight:600}
.dates{display:flex;gap:8px;align-items:center;margin-top:16px}
.dates select{flex:1;min-width:0}
select,input{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--bd);color:var(--ink);border-radius:13px;padding:13px 12px;font:600 15px 'Cairo',sans-serif;outline:none;appearance:none;-webkit-appearance:none}
select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239aa3bb' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:14px center;background-size:14px 14px;padding-inline-start:34px}
select option{background:#0d1233;color:#fff}
input:focus,select:focus{border-color:var(--cy);box-shadow:0 0 0 3px rgba(165,243,252,.15)}
input::placeholder{color:#6d7690}
.btn{border:0;border-radius:13px;font:700 15px 'Cairo',sans-serif;cursor:pointer;color:#fff;background:linear-gradient(135deg,#2a45e6,#1a2f9e);padding:13px 16px;transition:transform .1s}
.btn:active{transform:scale(.97)}
.ghost{background:rgba(255,255,255,.07);border:1px solid var(--bd)}
.sq{width:46px;height:46px;padding:0;flex:none;font-size:20px;line-height:1}
.form{display:grid;gap:10px}
.amt{font-family:'Barlow Condensed',sans-serif;font-size:30px!important;font-weight:700!important;direction:ltr;text-align:center}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:600 13px 'Cairo';color:var(--cy);background:rgba(165,243,252,.08);border:1px solid rgba(165,243,252,.25);border-radius:99px;padding:5px 13px;cursor:pointer}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.row .d{flex:1;font-weight:600;font-size:14px;word-break:break-word}
.row .a{font-family:'Barlow Condensed';font-weight:700;font-size:18px;direction:ltr}
.x{width:28px;height:28px;border-radius:50%;border:1px solid var(--bd);background:rgba(255,255,255,.05);color:var(--red);font-size:14px;cursor:pointer;flex:none}
.ck{-webkit-appearance:none;appearance:none;width:12px;height:12px;padding:0;border-radius:50%;border:1.5px solid var(--bd);background:transparent;flex:none;cursor:pointer}
.ck:checked{background:#2a45e6;border-color:#2a45e6}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:4px}
.empty{text-align:center;color:var(--mut);padding:26px 8px;font-size:14px}
h2{font-size:30px;margin:0 0 4px;font-weight:800;line-height:1.05}
h2 em{font-family:'Cairo';font-style:italic;color:var(--cy);font-weight:600}
.mhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.mhead b{font-size:19px}
.mhead .num{font-size:30px;font-weight:700;direction:ltr}
.cat{margin:11px 0}
.cat .l{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.cat .l span:last-child{font-family:'Barlow Condensed';font-weight:700;font-size:17px;direction:ltr}
.tr{height:7px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden}
.tr i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#2a45e6,#7fe9f7)}
.tip{border-inline-start:3px solid var(--cy);padding:4px 12px;margin:12px 0;font-size:14px;line-height:1.7}
.tip b{color:var(--cy)}
nav{position:fixed;inset:auto 0 0 0;background:rgba(5,6,13,.9);backdrop-filter:blur(14px);border-top:1px solid var(--bd);display:flex;justify-content:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav div{display:flex;max-width:560px;width:100%;gap:6px}
nav button{flex:1;background:none;border:0;color:var(--mut);font:700 11px 'Cairo';padding:7px 2px;border-radius:12px;cursor:pointer}
nav button.on{color:#fff;background:rgba(42,69,230,.35)}
nav button span{display:block;font-size:17px;margin-bottom:1px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:#16205f;border:1px solid var(--bd);padding:11px 16px;border-radius:14px;display:flex;gap:14px;align-items:center;font-size:14px;z-index:9;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.toast button{background:none;border:0;color:var(--cy);font:700 14px 'Cairo';cursor:pointer}
.kb{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(13,18,51,.97);border-top:1px solid var(--bd);padding:8px 12px;display:flex}
.kb button{flex:1;border:0;border-radius:13px;padding:13px;font:700 16px 'Cairo',sans-serif;color:#fff;background:linear-gradient(135deg,#2a45e6,#1a2f9e)}
.fld{position:relative}
.clr{position:absolute;top:50%;left:10px;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:14px;padding:0;cursor:pointer}
.kp{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(10,14,40,.98);border-top:1px solid var(--bd);padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px))}
.kg{display:flex;gap:8px;direction:ltr;max-width:560px;margin:0 auto}
.kd{flex:3;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ks{flex:1;display:grid;grid-template-rows:1fr 3fr;gap:8px}
.kp button{border:1px solid var(--bd);border-radius:14px;background:rgba(255,255,255,.08);color:#fff;font:700 26px 'Barlow Condensed',sans-serif;height:56px;cursor:pointer;touch-action:manipulation}
.kp button:active{background:rgba(255,255,255,.22)}
.kp .ks button{height:auto}
.kp .nx{background:linear-gradient(135deg,#2a45e6,#1a2f9e);font:700 18px 'Cairo',sans-serif}
.dayv{padding-bottom:calc(380px + env(safe-area-inset-bottom,0px))}
.dsearch{margin-bottom:10px}
.dp{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px}
.dp .arr{display:flex;gap:8px}
.dt{text-align:center;display:flex;flex-direction:column;gap:2px}
.dt b{font-family:'Barlow Condensed','Cairo',sans-serif;font-size:30px;font-weight:700;line-height:1.1}
.dt span{color:var(--cy);font-size:13px;font-weight:600}
.sels{grid-column:1/-1;display:grid;grid-template-columns:.8fr 1.3fr 1fr;gap:8px;padding-top:12px;border-top:1px solid var(--bd)}
.sl{display:block;min-width:0}
.sl i{display:block;font-style:normal;color:var(--mut);font-size:12px;font-weight:600;margin:0 4px 5px}
.sl select{padding:11px 10px;padding-inline-start:26px;font-size:14px}
.day{gap:10px}
.day>div:first-child{min-width:0;flex:1}
.day .num{flex:none;white-space:nowrap}
.note{font-size:11.5px;color:var(--mut);margin-top:1px;word-break:break-word}
.cutbox{max-height:230px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.rankbox{max-height:430px;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-right:14px}
.top3{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.top3 .r{display:flex;align-items:center;gap:10px}

  background:

  background:linear-gradient(180deg,#fff,var(--cy));-webkit-background-clip:text;background-clip:text;color:transparent;margin-top:6px}

<body>
<div class="wrap" id="app"></div>
<nav><div id="nav"></div></nav>
<div id="toast"></div>
<div id="kp" class="kp hide"></div>
<div id="sheetOverlay" class="sheet-overlay hide"></div>
<div id="sheet" class="sheet hide">
  <div class="sheet-head"><b>الإعدادات</b><button id="sheetClose" class="x" aria-label="إغلاق">✕</button></div>
  <div class="lab" style="margin-bottom:8px">كل الأقسام مجمّعة</div>
  <div id="sheetTotals"></div>
  <div class="lab" id="spacesLab" style="margin:20px 0 8px">اسم القسم</div>
  <div id="spaceList"></div>
  <div class="newspace"><input id="newSpaceName" placeholder="اسم قسم جديد (مثلاً: مصروفات البيت)" autocomplete="off"><button class="btn" id="addSpaceBtn">إنشاء</button></div>
  <div class="locksec">
    <div class="lockrow"><div class="d"><b>نسخة احتياطية</b><div class="note">صدّر بياناتك كملف واحتفظ بيه في أي مكان آمن — خصوصًا قبل ما تمسح الاختصار أو تعمل أي حاجة ممكن تمسح بيانات المتصفح</div></div></div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="btn" id="exportBackupBtn" style="flex:1">تصدير نسخة احتياطية</button>
      <button class="btn ghost" id="importBackupBtn" style="flex:1">استيراد نسخة احتياطية</button>
    </div>
    <input type="file" id="importFileInput" accept="application/json,.json" class="hide">
  </div>
  <div class="locksec" id="lockSection"></div>
</div>
<div id="editOverlay" class="sheet-overlay hide"></div>
<div id="editSheet" class="editpanel hide">
  <div class="sheet-head"><b id="editTitle">تعديل</b><button id="editClose" class="x" aria-label="إغلاق">✕</button></div>
  <div id="editBody"></div>
  <button class="btn" id="editSave" style="margin-top:14px;width:100%">حفظ</button>
</div>
<div id="confirmOverlay" class="sheet-overlay hide"></div>
<div id="confirmBox" class="confirmbox hide">
  <div id="confirmMsg"></div>
  <div class="confirmbtns"><button class="btn ghost" id="confirmCancel">إلغاء</button><button class="btn" id="confirmOk">حذف نهائي</button></div>
</div>
<div id="lockOverlay" class="lockwrap hide"></div>
<script>
const MN=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const ESS=['ايجار','إيجار','فاتورة','فواتير','كهرباء','مياه','غاز','انترنت','نت','دواء','علاج','دكتور','مدرسة','دراسة','قسط','اشتراك'];
const DKEY='mx_display_name',SKEY='mx_spaces_v1',AKEY='mx_active_space';
const NSKEY='mx_note_sections_v1',NAKEY='mx_active_notesec',FNKEY='mx_notes_flat_v1',NMIGKEY='mx_notes_migrated_v1';
const loadK=(k)=>{try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return []}};
const saveK=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const EK=id=>id==='default'?'mx_expenses_v1':'mx_expenses_'+id;
const IK=id=>id==='default'?'mx_incomes_v1':'mx_incomes_'+id;
const ASK=id=>id==='default'?'mx_assets_v1':'mx_assets_'+id;
const NK=id=>'mx_notes_'+id;
function activeSpaceObj(){return spaces.find(s=>s.id===activeSpace)||spaces[0]}
let spaces=loadK(SKEY);if(!spaces.length){spaces=[{id:'default',name:'مصاريفي'}];saveK(SKEY,spaces)}
let activeSpace=localStorage.getItem(AKEY)||'default';if(!spaces.some(s=>s.id===activeSpace))activeSpace=spaces[0].id;
const _legacyName=localStorage.getItem(DKEY);
if(_legacyName){const _def=spaces.find(s=>s.id==='default');if(_def&&_def.name==='مصاريفي'){_def.name=_legacyName;saveK(SKEY,spaces)}}
let data=loadK(EK(activeSpace)),incomes=loadK(IK(activeSpace)),assets=loadK(ASK(activeSpace));
const save=()=>saveK(EK(activeSpace),data);
const saveInc=()=>saveK(IK(activeSpace),incomes);
const saveAssets=()=>saveK(ASK(activeSpace),assets);
function migrateOldNotes(){
  if(localStorage.getItem(NMIGKEY))return;
  try{
    const oldSecs=loadK(NSKEY);
    if(oldSecs&&oldSecs.length){
      let flat=loadK(FNKEY);
      oldSecs.forEach(sec=>{
        const entries=loadK(NK(sec.id));
        if(entries&&entries.length){
          entries.forEach((en,i)=>{
            const nm=(en.title&&en.title.trim())?en.title.trim():(sec.name+(entries.length>1?' '+(i+1):''));
            flat.push({id:'nt'+(en.id?String(en.id).replace(/\./g,''):(Date.now()+Math.floor(Math.random()*100000))),name:nm,body:en.body||'',d:en.d||(new Date().toISOString().slice(0,10))})})}});
      saveK(FNKEY,flat)}
  }catch(e){}
  try{localStorage.setItem(NMIGKEY,'1')}catch(e){}}
migrateOldNotes();
let notes=loadK(FNKEY);
const saveNotesFlat=()=>saveK(FNKEY,notes);
let activeNoteId='',noteView='list',noteSelMode=false,notePicked=new Set();

// ---- App lock (PIN) ----
const LOCKKEY='mx_lock_v1';
function loadLock(){try{return JSON.parse(localStorage.getItem(LOCKKEY))||{enabled:false}}catch(e){return{enabled:false}}}
function saveLock(o){localStorage.setItem(LOCKKEY,JSON.stringify(o))}
let lockState=loadLock();
const PRIVKEY='mx_privacy_v1';
let privacyMode=localStorage.getItem(PRIVKEY)==='1';
function togglePrivacy(){privacyMode=!privacyMode;localStorage.setItem(PRIVKEY,privacyMode?'1':'0');render()}
const EYE_ON='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M6.61 6.61C3.06 8.82 1 12 1 12s4 8 11 8a9.26 9.26 0 0 0 5.39-1.61"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
let pinBuf='',pinFirst='',pinMode='enter',lockCallback=null;
async function sha256Hex(str){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('')}
function lockTitle(){
  if(pinMode==='setup1')return'اختار كود مكوّن من 4 أرقام';
  if(pinMode==='setup2')return'أكّد الكود تاني';
  return'التطبيق مقفول'}
let lockErrMsg='';
function renderLockScreen(){
  const showConfirm=pinMode==='setup2';
  const ov=document.getElementById('lockOverlay');
  const iconSrc=document.getElementById('appIcon').href;
  const digitsHTML=['1','2','3','4','5','6','7','8','9'].map(k=>`<button type="button" data-lk="${k}">${k}</button>`).join('');
  const lastRow=`<button type="button" style="visibility:hidden" tabindex="-1"></button><button type="button" data-lk="0">0</button><button type="button" class="bk" data-lk="⌫">⌫</button>`;
  ov.innerHTML=`<div class="lock-hero">
      <img class="lockicon" src="${iconSrc}" alt="">
      <div class="lockword">Masrofaty</div>
      <div class="locklab">${lockTitle()}</div>
    </div>
    <div class="lock-mid">
      <div class="pindots">${Array.from({length:4},(_,i)=>`<span class="pd${i<pinBuf.length?' on':''}"></span>`).join('')}</div>
      <div class="lockerr" id="lockErr">${esc(lockErrMsg)}</div>
      ${showConfirm?`<button type="button" class="btn" id="pinConfirmBtn" style="max-width:200px" ${pinBuf.length<4?'disabled':''}>تأكيد</button>`:''}
    </div>
    <div class="lockkp">${digitsHTML}${lastRow}</div>
    ${lockCallback?`<button type="button" class="lockcancel" id="lockCancelBtn">إلغاء</button>`:''}`;
  document.querySelectorAll('[data-lk]').forEach(b=>b.onclick=()=>lockKeyPress(b.dataset.lk));
  if(document.getElementById('lockCancelBtn'))document.getElementById('lockCancelBtn').onclick=cancelLockFlow;
  if(document.getElementById('pinConfirmBtn'))document.getElementById('pinConfirmBtn').onclick=confirmPinSetup}
function showLockOverlay(){
  pinBuf='';pinFirst='';pinMode='enter';lockCallback=null;lockErrMsg='';
  document.getElementById('lockOverlay').classList.remove('hide');
  renderLockScreen()}
function hideLockOverlay(){document.getElementById('lockOverlay').classList.add('hide')}
function cancelLockFlow(){lockCallback=null;pinBuf='';pinFirst='';pinMode='enter';lockErrMsg='';hideLockOverlay()}
function completeUnlock(){
  if(lockCallback){const cb=lockCallback;lockCallback=null;pinBuf='';pinFirst='';pinMode='enter';lockErrMsg='';hideLockOverlay();cb();return}
  pinBuf='';lockErrMsg='';hideLockOverlay()}
async function lockKeyPress(k){
  if(k==='')return;
  if(k==='⌫'){pinBuf=pinBuf.slice(0,-1);lockErrMsg='';renderLockScreen();return}
  if(pinBuf.length>=4)return;
  pinBuf+=k;lockErrMsg='';renderLockScreen();
  if(pinBuf.length<4)return;
  if(pinMode==='setup1'){pinFirst=pinBuf;pinBuf='';pinMode='setup2';renderLockScreen();return}
  if(pinMode==='setup2')return;
  const hash=await sha256Hex((lockState.salt||'')+pinBuf);
  if(hash===lockState.pinHash){completeUnlock()}
  else{lockErrMsg='الكود غلط';pinBuf='';renderLockScreen()}}
async function confirmPinSetup(){
  if(pinBuf.length<4)return;
  if(pinBuf!==pinFirst){lockErrMsg='الكود مش متطابق، حاول تاني';pinBuf='';pinFirst='';pinMode='setup1';renderLockScreen();return}
  const salt=[...crypto.getRandomValues(new Uint8Array(8))].map(b=>b.toString(16).padStart(2,'0')).join('');
  const hash=await sha256Hex(salt+pinFirst);
  lockState={enabled:true,pinHash:hash,salt};saveLock(lockState);
  completeUnlock()}
function startLockSetup(){
  pinMode='setup1';pinBuf='';pinFirst='';lockErrMsg='';
  lockCallback=()=>{toast('اتفعّل قفل التطبيق');openSheet()};
  document.getElementById('lockOverlay').classList.remove('hide');renderLockScreen()}
function startLockDisable(){
  pinMode='enter';pinBuf='';lockErrMsg='';
  lockCallback=()=>{lockState={enabled:false,pinHash:null,salt:null};saveLock(lockState);toast('اتلغى قفل التطبيق');openSheet()};
  document.getElementById('lockOverlay').classList.remove('hide');renderLockScreen()}
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
let sel=today(),tab='day',selMode=false,picked=new Set(),yr=new Date().getFullYear(),undo=null,tt;
let navScrollState='top';
const fmt=n=>privacyMode?'••••':(Math.round(n*100)/100).toLocaleString('en-US');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=a=>a.reduce((s,e)=>s+e.a,0);
const parts=s=>s.split('-').map(Number);
const fmtDate=iso=>{const [y,m,d]=parts(iso);return d+' '+MN[m-1]+' '+y};
const toNum=v=>parseFloat(String(v).replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).replace(/[٫,]/g,'.'));
function cats(list){const m={};list.forEach(e=>{const k=e.t.trim()||'بدون وصف';(m[k]=m[k]||{n:k,s:0,c:0});m[k].s+=e.a;m[k].c++});return Object.values(m).sort((a,b)=>b.s-a.s)}
function shift(n){const [y,m,d]=parts(sel);const t=new Date(y,m-1,d+n);sel=iso(t);picked.clear();render()}
function setDate(y,m,d){const dim=new Date(y,m,0).getDate();sel=y+'-'+pad(m)+'-'+pad(Math.min(d,dim));picked.clear();render()}
function add(){
  const a=document.getElementById('amt'),t=document.getElementById('desc'),n=document.getElementById('note');
  const v=toNum(a.value);
  if(!v||v<=0){a.focus();a.style.borderColor='var(--red)';return}
  data.push({id:Date.now()+Math.random(),d:sel,a:v,t:t.value.trim(),note:n?n.value.trim():''});save();render();
  kpHide()}

    if(!ln.trim())return'<div>&nbsp;</div>';
    const done=ln.trim().startsWith('✔');
    const txt=esc(ln.replace(/^\s*✔\s*/,''));
    return `<div data-nl="${i}" style="cursor:pointer"><span class="chk">${done?'✔ ':''}</span>${txt}</div>`}).join('')}
function toggleNoteEditMode(){noteEditing=!noteEditing;render()}
function vNotes(){
  if(noteView==='detail'&&activeNoteId){
    const n=notes.find(x=>x.id===activeNoteId);
    if(!n){noteView='list';activeNoteId='';return vNotes()}
    return `<div class="top"><div class="brand"><i></i>مصروفاتي</div><div class="topright"><button class="gear${noteEditing?' on':''}" id="markModeBtn" aria-label="${noteEditing?'عرض':'تعديل'}">${noteEditing?'✓':'✎'}</button></div></div>
    <div class="eyebrow">النوت</div>
    <div class="nthead">
      <div class="ntname"><h2>${esc(n.name)}</h2><button class="pen" id="renameNoteBtn" aria-label="تعديل الاسم">✎</button></div>
      <div class="ntdate"><span>${fmtDate(n.d)}</span><button class="pen" id="editNoteDateBtn" aria-label="تعديل التاريخ">✎</button></div>
    </div>
    <div class="nbacktop"><button class="gear" id="backNotes" aria-label="رجوع">→</button></div>
    <div class="nbwrap">
      ${noteEditing
        ?`<textarea id="noteBody" class="notewrite" placeholder="اكتب هنا بلا حدود…">${esc(n.body)}</textarea>`
        :`<div id="noteViewBox" class="notewrite noteview">${renderNoteView(n.body)}</div>`}
    </div>`}
  return `${topBar()}
  <div class="eyebrow">النوت</div><h2>دوّن <em>أفكارك</em></h2>
  <div class="card form">
    <input id="newNoteName" placeholder="اسم الملاحظة الجديدة" autocomplete="off">
    <button class="btn" id="addNoteBtn">إنشاء</button>
  </div>
  <div class="card">
    <div class="bar"><span class="lab">الملاحظات · ${notes.length}</span>
    ${notes.length?`<button class="chip" onclick="noteSelMode=!noteSelMode;notePicked.clear();render()">${noteSelMode?'إلغاء':'تحديد'}</button>`:''}</div>
    ${notes.length?`<input id="noteSearch" placeholder="بحث عن ملاحظة بالاسم" value="${esc(noteFilter)}" autocomplete="off" style="margin-bottom:10px">`:''}
    ${noteSelMode&&notes.length?`<div class="row"><input type="checkbox" class="ck" id="nall" ${notePicked.size===noteFilterList().length?'checked':''}><span class="d">تحديد الكل</span><button class="btn" style="padding:8px 14px;background:#b3283a" id="ndelsel" ${notePicked.size?'':'disabled style="opacity:.4"'}>حذف (${notePicked.size})</button></div>`:''}
    <div id="noteListWrap">${renderNoteRows()}</div>
  </div>`}

function render(){
  const v=tab==='day'?vDay():tab==='months'?vMonths():tab==='add'?vAdditions():tab==='assets'?vAssets():tab==='notes'?vNotes():vInsights();
  const sy=window.scrollY;document.getElementById('app').innerHTML=v;document.body.classList.toggle('dayv',tab==='day'||tab==='add'||tab==='assets');window.scrollTo(0,sy);
  document.getElementById('nav').innerHTML=[['day','◉','اليوم'],['months','▦','الشهور'],['add','⊕','الإضافات'],['assets','◆','الأصول'],['notes','✎','النوت'],['ins','◭','التحليل']].map(([k,i,l])=>`<button class="${tab===k?'on':''}" data-t="${k}"><span>${i}</span>${l}</button>`).join('');
  bind()}
function scrollToTopSmooth(){window.scrollTo({top:0,behavior:'smooth'})}
function scrollToEndSmooth(){
  const app=document.getElementById('app'),nav=document.querySelector('nav');
  if(!app)return;
  const rect=app.getBoundingClientRect();
  const navH=nav?nav.offsetHeight:0;
  const target=window.scrollY+rect.bottom-window.innerHeight+navH+18;
  window.scrollTo({top:Math.max(0,target),behavior:'smooth'})}

function wireClearButtons(){
  ['amt','desc','note','inamt','icat','inote','asamt','ascat','asnote','e_amt','e_desc','e_note','i_amt','i_cat','i_note','as_amt','as_cat','as_note','newNoteName','rn_name','sp_name','incFilter','assetFilter','noteSearch','dayFilterInp'].forEach(id=>{
    const i=document.getElementById(id);if(!i)return;
    if(i.parentNode.classList.contains('fld'))return;
    const w=document.createElement('div');w.className='fld';i.parentNode.insertBefore(w,i);w.appendChild(i);
    if(['desc','note','icat','inote','ascat','asnote','e_desc','e_note','i_cat','i_note','as_cat','as_note','newNoteName','rn_name','sp_name','incFilter','assetFilter','noteSearch','dayFilterInp'].includes(id))i.style.paddingInlineEnd='44px';
    const b=document.createElement('button');b.type='button';b.className='clr hide';b.textContent='✕';b.setAttribute('aria-label','مسح');w.appendChild(b);
    const upd2=()=>b.classList.toggle('hide',!i.value);
    b.onpointerdown=e=>e.preventDefault();b.onclick=()=>{i.value='';upd2();i.dispatchEvent(new Event('input'));i.focus({preventScroll:true})};i.oninput=upd2;upd2();
    w.addEventListener('click',()=>{if(document.activeElement!==i)i.focus()})});}
function wireAmtFields(){
  document.querySelectorAll('input.amt').forEach(inp=>{
    inp.onfocus=()=>{const y=window.scrollY;kpShow(inp.id);setTimeout(()=>window.scrollTo(0,y),60)};
    inp.onblur=()=>setTimeout(()=>{if(!document.activeElement||!document.activeElement.classList.contains('amt'))kpHide()},150)});}

function bind(){
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{
    const same=b.dataset.t===tab;
    tab=b.dataset.t;selMode=false;picked.clear();noteSelMode=false;notePicked.clear();render();
    if(!same){navScrollState='top';scrollToTopSmooth()}
    else if(navScrollState==='top'){navScrollState='bottom';scrollToEndSmooth()}
    else{navScrollState='top';scrollToTopSmooth()}});
  const g=id=>document.getElementById(id);
  if(g('settingsBtn'))g('settingsBtn').onclick=openSheet;
  if(g('privacyBtn'))g('privacyBtn').onclick=togglePrivacy;
  if(g('sd')){const f=()=>setDate(+g('sy').value,+g('sm').value,+g('sd').value);g('sd').onchange=g('sm').onchange=g('sy').onchange=f;}
  wireClearButtons();wireAmtFields();
  if(g('amt')){
    chain('desc','note');chain('note',null,add);
    document.querySelectorAll('.chip[data-c]').forEach(c=>c.onclick=()=>{g('desc').value=c.dataset.c;g('amt').focus()})}
  if(g('dayListWrap')){bindDayRows()}
  if(g('dayFilterInp'))g('dayFilterInp').addEventListener('input',()=>{dayFilter=g('dayFilterInp').value;document.getElementById('dayListWrap').innerHTML=renderDayRows();bindDayRows()});
  if(g('icat')){chain('icat','inote');chain('inote',null,()=>g('inote').blur())}
  if(g('idate_d'))wireDsel('idate');
  bindIncRows();
  if(g('incFilter'))g('incFilter').addEventListener('input',()=>{incFilter=g('incFilter').value;document.getElementById('incListWrap').innerHTML=renderIncRows();bindIncRows()});
  if(g('ascat')){chain('ascat','asnote');chain('asnote',null,()=>g('asnote').blur())}
  if(g('asdate_d'))wireDsel('asdate');
  bindAssetRows();
  if(g('assetFilter'))g('assetFilter').addEventListener('input',()=>{assetFilter=g('assetFilter').value;document.getElementById('assetListWrap').innerHTML=renderAssetRows();bindAssetRows()});
  if(g('my'))g('my').onchange=e=>{yr=+e.target.value;render()};
  if(g('backNotes'))g('backNotes').onclick=backNotes;
  if(g('renameNoteBtn'))g('renameNoteBtn').onclick=()=>renameNote(activeNoteId);
  if(g('editNoteDateBtn'))g('editNoteDateBtn').onclick=()=>editNoteDate(activeNoteId);
  if(g('markModeBtn'))g('markModeBtn').onclick=toggleNoteEditMode;
  if(g('noteBody')){
    const nb=g('noteBody');let nTimer;
    nb.oninput=()=>{clearTimeout(nTimer);nTimer=setTimeout(()=>{const n=notes.find(x=>x.id===activeNoteId);if(n){n.body=nb.value;saveNotesFlat()}},350)}}
  if(g('noteViewBox'))document.querySelectorAll('[data-nl]').forEach(d=>d.onclick=()=>toggleLineDone(+d.dataset.nl));
  if(g('addNoteBtn'))g('addNoteBtn').onclick=()=>{const i=g('newNoteName');createNote(i.value);i.value=''};
  if(g('newNoteName'))g('newNoteName').onkeydown=e=>{if(e.key==='Enter')g('addNoteBtn').click()};
  bindNoteRows();
  if(g('noteSearch'))g('noteSearch').addEventListener('input',()=>{noteFilter=g('noteSearch').value;document.getElementById('noteListWrap').innerHTML=renderNoteRows();bindNoteRows()});
  if(g('nall'))g('nall').onchange=e=>{notePicked.clear();if(e.target.checked)noteFilterList().forEach(n=>notePicked.add(n.id));render()};
  if(g('ndelsel'))g('ndelsel').onclick=()=>notePicked.size&&deleteNotes([...notePicked])}

const NEXT={amt:'desc',inamt:'icat',asamt:'ascat',e_amt:'e_desc',i_amt:'i_cat',as_amt:'as_cat'};
const kp=document.getElementById('kp');
kp.innerHTML='<div class="kg"><div class="kd">'+['1','2','3','4','5','6','7','8','9','.','0','00'].map(k=>`<button data-k="${k}">${k}</button>`).join('')+'</div><div class="ks"><button data-k="del">⌫</button><button data-k="next" class="nx">التالي ‹</button></div></div>';
function kpShow(id){kp.dataset.cur=id;kp.classList.remove('hide');document.body.classList.add('kpo')}
function kpHide(){kp.classList.add('hide');document.body.classList.remove('kpo')}
kp.onpointerdown=e=>e.preventDefault();
kp.onclick=e=>{const k=e.target.closest('button');if(!k)return;const id=kp.dataset.cur,a=document.getElementById(id);if(!a)return;const c=k.dataset.k;
  if(c==='next'){const nx=NEXT[id];if(nx){const el=document.getElementById(nx);if(el)el.focus({preventScroll:true})}else{a.blur();kpHide()}return}
  if(c==='del')a.value=a.value.slice(0,-1);
  else{if(c==='.'&&a.value.includes('.'))return;if(!a.value&&c==='00')return;if(c==='.'&&!a.value)a.value='0';if(a.value.length<12)a.value+=c}
  a.dispatchEvent(new Event('input'));a.focus({preventScroll:true})};
document.addEventListener('click',e=>{if(e.target.closest('#kp,input,.clr,select,label'))return;const a=document.activeElement;if(a&&a.classList&&a.classList.contains('amt'))a.blur();kpHide()});

function globalTotals(){
  let inc=0,exp=0,ast=0;
  spaces.forEach(s=>{
    const sExp=s.id===activeSpace?data:loadK(EK(s.id));
    const sInc=s.id===activeSpace?incomes:loadK(IK(s.id));
    const sAst=s.id===activeSpace?assets:loadK(ASK(s.id));
    exp+=sum(sExp);inc+=sum(sInc);ast+=sum(sAst)});
  return {inc,exp,ast,diff:inc-exp}}
function renderSheet(){
  const gt=globalTotals();
  document.getElementById('sheetTotals').innerHTML=`<div class="sumrow">
    <div class="sumcard"><div class="sumlab">الإضافات</div><div class="sumval inc">+${fmt(gt.inc)}</div></div>
    <div class="sumcard"><div class="sumlab">المصروفات</div><div class="sumval exp">-${fmt(gt.exp)}</div></div>
    <div class="sumcard"><div class="sumlab">المتبقي</div><div class="sumval ${gt.diff>=0?'pos':'neg'}">${gt.diff>=0?'+':'-'}${fmt(Math.abs(gt.diff))}</div></div>
    <div class="sumcard"><div class="sumlab">الأصول</div><div class="sumval ast">${fmt(gt.ast)}</div></div>
  </div>`;
  document.getElementById('spacesLab').textContent='اسم القسم ('+spaces.length+')';
  document.getElementById('spaceList').innerHTML=spaces.map(s=>`<div class="srow ${s.id===activeSpace?'on':''}" data-sw="${s.id}"><div class="main"><b>${esc(s.name)}</b></div><span class="trail"><button class="pen" data-rnspace="${s.id}" aria-label="تعديل">✎</button><button class="sdel" data-delspace="${s.id}" aria-label="حذف">✕</button><span class="chev">‹</span></span></div>`).join('');
  document.querySelectorAll('[data-sw]').forEach(r=>r.onclick=()=>switchSpace(r.dataset.sw));
  document.querySelectorAll('[data-rnspace]').forEach(b=>b.onclick=e=>{e.stopPropagation();renameSpace(b.dataset.rnspace)});
  document.querySelectorAll('[data-delspace]').forEach(b=>b.onclick=e=>{e.stopPropagation();deleteSpace(b.dataset.delspace)});
  document.getElementById('lockSection').innerHTML=`<div class="lockrow"><div class="d"><b>قفل التطبيق</b><div class="note">${lockState.enabled?'مفعّل — كود دخول':'مش مفعّل'}</div></div><button class="btn" id="lockToggleBtn" style="width:auto;padding:10px 18px">${lockState.enabled?'إيقاف':'تفعيل'}</button></div>`;
  document.getElementById('lockToggleBtn').onclick=()=>{lockState.enabled?startLockDisable():startLockSetup()}}
function openSheet(){renderSheet();document.getElementById('sheetOverlay').classList.remove('hide');document.getElementById('sheet').classList.remove('hide')}
function closeSheet(){document.getElementById('sheetOverlay').classList.add('hide');document.getElementById('sheet').classList.add('hide')}
function switchSpace(id){
  if(id===activeSpace){closeSheet();return}
  activeSpace=id;localStorage.setItem(AKEY,id);
  data=loadK(EK(id));incomes=loadK(IK(id));assets=loadK(ASK(id));
  sel=today();tab='day';picked.clear();selMode=false;
  render();closeSheet()}
function addSpace(name){
  name=name.trim();if(!name)return;
  const id='s'+Date.now();
  spaces.push({id,name});saveK(SKEY,spaces);
  switchSpace(id)}
function deleteSpace(id){
  const sp=spaces.find(s=>s.id===id);if(!sp)return;
  askConfirm('هتحذف قسم "'+sp.name+'" وكل بياناته نهائيًا. متأكد؟',()=>{
    spaces=spaces.filter(s=>s.id!==id);
    try{localStorage.removeItem(EK(id));localStorage.removeItem(IK(id));localStorage.removeItem(ASK(id))}catch(e){}
    if(!spaces.length){spaces=[{id:'s'+Date.now(),name:'قسمي'}]}
    saveK(SKEY,spaces);
    if(id===activeSpace){activeSpace=spaces[0].id;localStorage.setItem(AKEY,activeSpace);data=loadK(EK(activeSpace));incomes=loadK(IK(activeSpace));assets=loadK(ASK(activeSpace));tab='day';sel=today()}
    render();renderSheet()})}
function renameSpace(id){
  const s=spaces.find(x=>x.id===id);if(!s)return;
  openEdit('تعديل اسم القسم',`<input id="sp_name" value="${esc(s.name)}" placeholder="اسم القسم">`,()=>{
    const v=document.getElementById('sp_name').value.trim();if(!v)return;
    s.name=v;saveK(SKEY,spaces);render();renderSheet()})}
document.getElementById('sheetOverlay').onclick=closeSheet;
document.getElementById('sheetClose').onclick=closeSheet;
document.getElementById('addSpaceBtn').onclick=()=>{const i=document.getElementById('newSpaceName');addSpace(i.value);i.value=''};
document.getElementById('newSpaceName').onkeydown=e=>{if(e.key==='Enter')document.getElementById('addSpaceBtn').click()};
function exportBackup(){
  const payload={app:'masrofaty',version:1,exportedAt:new Date().toISOString(),spaces,activeSpace,data:{},notes:loadK(FNKEY)};
  spaces.forEach(s=>{payload.data[s.id]={expenses:loadK(EK(s.id)),incomes:loadK(IK(s.id)),assets:loadK(ASK(s.id))}});
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='masrofaty-backup-'+today()+'.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  toast('اتعمل تصدير النسخة الاحتياطية')}
function handleImportFile(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    let payload;
    try{payload=JSON.parse(reader.result)}catch(err){toast('الملف مش صالح');return}
    if(!payload||!payload.spaces||!payload.data){toast('الملف مش بتنسيق نسخة احتياطية صحيح');return}
    askConfirm('هيتم استبدال كل البيانات الحالية بالنسخة الاحتياطية دي نهائيًا. متأكد؟',()=>{
      spaces=payload.spaces.length?payload.spaces:spaces;saveK(SKEY,spaces);
      Object.keys(payload.data).forEach(id=>{
        const d=payload.data[id]||{};
        saveK(EK(id),d.expenses||[]);saveK(IK(id),d.incomes||[]);saveK(ASK(id),d.assets||[])});
      if(payload.notes)saveK(FNKEY,payload.notes);
      activeSpace=(payload.activeSpace&&spaces.some(s=>s.id===payload.activeSpace))?payload.activeSpace:spaces[0].id;
      localStorage.setItem(AKEY,activeSpace);
      data=loadK(EK(activeSpace));incomes=loadK(IK(activeSpace));assets=loadK(ASK(activeSpace));notes=loadK(FNKEY);
      tab='day';sel=today();picked.clear();selMode=false;
      render();renderSheet();
      toast('اترجعت النسخة الاحتياطية بنجاح')})};
  reader.readAsText(file);
  e.target.value=''}
document.getElementById('exportBackupBtn').onclick=exportBackup;
document.getElementById('importBackupBtn').onclick=()=>document.getElementById('importFileInput').click();
document.getElementById('importFileInput').onchange=handleImportFile;

function backNotes(){activeNoteId='';noteView='list';noteEditing=true;render();scrollTo(0,0)}
function openNote(id){activeNoteId=id;noteView='detail';noteEditing=false;render();scrollTo(0,0)}
function createNote(name){name=name.trim();if(!name)return;const id='nt'+Date.now();notes.push({id,name,body:'',d:today()});saveNotesFlat();openNote(id)}
function renameNote(id){
  const n=notes.find(x=>x.id===id);if(!n)return;
  openEdit('تعديل اسم الملاحظة',`<input id="rn_name" value="${esc(n.name)}" placeholder="اسم الملاحظة">`,()=>{
    const v=document.getElementById('rn_name').value.trim();if(!v)return;
    n.name=v;saveNotesFlat();render()})}
function editNoteDate(id){
  const n=notes.find(x=>x.id===id);if(!n)return;
  openEdit('تعديل تاريخ الملاحظة',dsel('nd_edit',n.d),()=>{
    n.d=dselVal('nd_edit');saveNotesFlat();render()});
  wireDsel('nd_edit')}
function deleteNotes(ids){
  askConfirm(ids.length>1?'هتحذف '+ids.length+' ملاحظات نهائيًا. متأكد؟':'هتحذف الملاحظة دي نهائيًا. متأكد؟',()=>{
    notes=notes.filter(n=>!ids.includes(n.id));saveNotesFlat();
    if(ids.includes(activeNoteId)){activeNoteId='';noteView='list'}
    notePicked.clear();noteSelMode=false;render()})}
let confirmCb=null;
function askConfirm(msg,onYes){
  document.getElementById('confirmMsg').textContent=msg;
  confirmCb=onYes;
  document.getElementById('confirmOverlay').classList.remove('hide');
  document.getElementById('confirmBox').classList.remove('hide')}
function closeConfirm(){document.getElementById('confirmOverlay').classList.add('hide');document.getElementById('confirmBox').classList.add('hide');confirmCb=null}
document.getElementById('confirmOverlay').onclick=closeConfirm;
document.getElementById('confirmCancel').onclick=closeConfirm;
document.getElementById('confirmOk').onclick=()=>{const cb=confirmCb;closeConfirm();if(cb)cb()};

let editCtx=null;
function openEdit(title,bodyHTML,onSave){
  document.getElementById('editTitle').textContent=title;
  document.getElementById('editBody').innerHTML=bodyHTML;
  editCtx=onSave;
  wireClearButtons();wireAmtFields();
  const af=document.querySelector('#editBody input.amt');if(af)setTimeout(()=>af.focus(),50);
  document.getElementById('editOverlay').classList.remove('hide');document.getElementById('editSheet').classList.remove('hide')}
function closeEdit(){document.getElementById('editOverlay').classList.add('hide');document.getElementById('editSheet').classList.add('hide');editCtx=null;kpHide()}
document.getElementById('editOverlay').onclick=closeEdit;
document.getElementById('editClose').onclick=closeEdit;
document.getElementById('editSave').onclick=()=>{if(editCtx)editCtx();closeEdit()};

function editExpense(id){
  const e=data.find(x=>x.id===id);if(!e)return;
  openEdit('تعديل المصروف',`<input id="e_amt" class="amt" inputmode="none" value="${e.a}"><input id="e_desc" list="dl" placeholder="الوصف" value="${esc(e.t)}"><input id="e_note" placeholder="ملاحظات (اختياري)" value="${esc(e.note||'')}">`,()=>{
    const v=toNum(document.getElementById('e_amt').value);if(!v||v<=0)return;
    e.a=v;e.t=document.getElementById('e_desc').value.trim();e.note=document.getElementById('e_note').value.trim();save();render()});
  chain('e_desc','e_note');chain('e_note',null,()=>document.getElementById('editSave').click())}
function editIncome(id){
  const e=incomes.find(x=>x.id===id);if(!e)return;
  openEdit('تعديل الإضافة',`<input id="i_amt" class="amt" inputmode="none" value="${e.a}"><input id="i_cat" placeholder="التصنيف" value="${esc(e.cat)}"><input id="i_note" placeholder="كومنت (اختياري)" value="${esc(e.note||'')}"><div class="lab" style="margin:4px 0 2px">التاريخ</div>${dsel('i_date',e.d)}`,()=>{
    const v=toNum(document.getElementById('i_amt').value);if(!v||v<=0)return;
    e.a=v;e.cat=document.getElementById('i_cat').value.trim();e.note=document.getElementById('i_note').value.trim();e.d=dselVal('i_date');saveInc();render()});
  chain('i_cat','i_note');chain('i_note',null,()=>document.getElementById('i_note').blur());
  wireDsel('i_date')}
function editAsset(id){
  const e=assets.find(x=>x.id===id);if(!e)return;
  openEdit('تعديل الأصل',`<input id="as_amt" class="amt" inputmode="none" value="${e.a}"><input id="as_cat" placeholder="التصنيف" value="${esc(e.cat)}"><input id="as_note" placeholder="كومنت (اختياري)" value="${esc(e.note||'')}"><div class="lab" style="margin:4px 0 2px">التاريخ</div>${dsel('as_date',e.d)}`,()=>{
    const v=toNum(document.getElementById('as_amt').value);if(!v||v<=0)return;
    e.a=v;e.cat=document.getElementById('as_cat').value.trim();e.note=document.getElementById('as_note').value.trim();e.d=dselVal('as_date');saveAssets();render()});
  chain('as_cat','as_note');chain('as_note',null,()=>document.getElementById('as_note').blur());
  wireDsel('as_date')}
render();
if(lockState.enabled)showLockOverlay();
let appNeedsRelock=false;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){if(lockState.enabled&&!lockCallback)appNeedsRelock=true}
  else if(appNeedsRelock){appNeedsRelock=false;showLockOverlay()}});
</script>
